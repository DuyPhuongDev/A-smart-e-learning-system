server:
  port: 8092

prefix-api: /api/coaching-chatbot/v1

spring:
  application:
    name: coaching-chatbot-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lms_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:lms_user}
    password: ${DB_PASSWORD:lms_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    #    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: coaching_chatbot

  flyway:
    enabled: false
    locations: classpath:db/migration
    schemas: coaching_chatbot
    default-schema: coaching_chatbot
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
    out-of-order: false
    validate-on-migrate: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: basic
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: 6334
  api-key: ${QDRANT_API_KEY:lms_qdrant_vector_secret_key}
  use-tls: false
  collection-name: lecture_knowledge

gemini:
  api-key: ${GEMINI_API_KEY:your-gemini-api-key}

# Transcript Enrichment Configuration
transcript-enrichment:
  llm-delay-ms: 5000
  max-retries: 3
  segment-duration-seconds: 90
  context-window-size: 5
  max-summary-words: 100
  questions-per-chunk: 4


# Chatbot Configuration
chatbot:
  max-context-messages: 6  # 3 Q&A pairs
  max-knowledge-chunks: 5
  min-relevance-score: 0.6  # Threshold for filtering relevant chunks
  retry-max-attempts: 3
  retry-delay-ms: 2000
  error-fallback-message-vi: "Xin lỗi, tôi không thể trả lời câu hỏi lúc này. Vui lòng thử lại sau."
  error-fallback-message-en: "Sorry, I cannot answer your question right now. Please try again later."
