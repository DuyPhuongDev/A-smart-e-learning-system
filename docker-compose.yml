services:
  # ========================================
  # Single Shared PostgreSQL Database
  # ========================================
  
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lms-postgres
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

#  # ========================================
#  # Cloud flared
#  # ========================================
#
#  cloud-flared-tunnel:
#    image: cloudflare/cloudflared:latest
#    container_name: cloud-flared-tunnel
#    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
#    networks:
#      - lms-network

  # ========================================
  # Kafka Stack
  # Topic lms.events.notification is created on first publish (default auto-create).
  # ========================================

  kafka-1:
    image: apache/kafka
    hostname: kafka-1
    container_name: kafka-kraft-1
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka-1:9093,INTERNAL://kafka-1:9094
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:29092,INTERNAL://kafka-1:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - lms-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data-1:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui
    ports:
      - "9999:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "kraft-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9094
    depends_on:
      - kafka-1
    networks:
      - lms-network

  # ========================================
  # Infrastructure Services
  # ========================================
  
  # Service Discovery - Eureka Server
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production-min-256-bits}
    depends_on:
      - eureka-server
    networks:
      - lms-network

  # ========================================
  # Business Services (All use shared DB)
  # ========================================

  # Authentication Service
  authentication-service:
    build:
      context: .
      dockerfile: authentication-service/Dockerfile
    container_name: authentication-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production-min-256-bits}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - lms-network

  # User Management Service
  user-management-service:
    build:
      context: .
      dockerfile: user-management-service/Dockerfile
    container_name: user-management-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9094
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-1:
        condition: service_started
    networks:
      - lms-network

  # Course Management Service
  course-management-service:
    build:
      context: .
      dockerfile: course-management-service/Dockerfile
    container_name: course-management-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9094
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-1:
        condition: service_started
    networks:
      - lms-network

  # Assessment Service (Management + Execution)
  assessment-service:
    build:
      context: .
      dockerfile: assessment-service/Dockerfile
    container_name: assessment-service
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9094
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-1:
        condition: service_started
    networks:
      - lms-network

  # Learning Service (Delivery + Tracking + Enrollment)
  learning-service:
    build:
      context: .
      dockerfile: learning-service/Dockerfile
    container_name: learning-service
    ports:
      - "8086:8086"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - lms-network

  # Personalization Service (Student Personalization + Analytics)
  personalization-service:
    build:
      context: .
      dockerfile: personalization-service/Dockerfile
    container_name: personalization-service
    ports:
      - "8087:8087"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - GEMINI_API_KEY=${GEMINI_API_KEY:-key_here}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - lms-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8090:8090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9094
      - NOTIFICATION_WS_ALLOWED_ORIGINS=https://lms.dphuongdev.io.vn
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@welearning.local}
      - FE_URL=https://lms.dphuongdev.io.vn
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-1:
        condition: service_started
    networks:
      - lms-network

  # Learning Service (Delivery + Tracking + Enrollment)
  coaching-chatbot-service:
    build:
      context: .
      dockerfile: coaching-chatbot-service/Dockerfile
    container_name: coaching-chatbot-service
    ports:
      - "8092:8092"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - MODEL_CACHE_DIR=/usr/bin/prediction_model_cache
      - GEMINI_API_KEY=${GEMINI_API_KEY:-key_here}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
      - QDRANT_HOST=${QDRANT_HOST:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data-1:
