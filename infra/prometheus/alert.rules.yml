groups:
  - name: notification-alerts
    rules:
      - alert: NotificationDeliveryFailureRateHigh
        expr: |
          (
            sum(rate(notification_delivery_total{status="FAILED"}[15m]))
            /
            clamp_min(sum(rate(notification_delivery_total[15m])), 0.001)
          ) > 0.05
        for: 15m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Notification delivery failure rate is above 5%"
          description: "Delivery failure ratio > 5% for 15 minutes."

      - alert: NotificationDlqSpike
        expr: increase(notification_dlq_total[15m]) > 20
        for: 5m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "Notification DLQ spike detected"
          description: "notification_dlq_total increased by more than 20 in 15 minutes."

      - alert: NotificationSchedulerLagHigh
        expr: notification_scheduler_lag_seconds > 120
        for: 10m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Notification scheduler lag is above 2 minutes"
          description: "notification_scheduler_lag_seconds exceeded 120s for over 10 minutes."
