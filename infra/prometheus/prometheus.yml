global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "eureka-server"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "authentication-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["authentication-service:8081"]

  - job_name: "user-management-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-management-service:8082"]

  - job_name: "course-management-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["course-management-service:8083"]

  - job_name: "assessment-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["assessment-service:8084"]

  - job_name: "learning-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["learning-service:8086"]

  - job_name: "personalization-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["personalization-service:8087"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8090"]

  - job_name: "coaching-chatbot-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["coaching-chatbot-service:8092"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
