server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # (Tùy chọn) Bỏ log của các container monitoring — bỏ # ở 3 dòng dưới để bật
      # (ưu tiên theo label Compose vì khớp đúng tên service trong docker-compose)
      # - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
      #   regex: "^(promtail|loki|prometheus|grafana|portainer|cadvisor|node-exporter)$"
      #   action: drop

      # Thêm label "compose_service" để phân biệt service trong Compose
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"

      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"

      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
