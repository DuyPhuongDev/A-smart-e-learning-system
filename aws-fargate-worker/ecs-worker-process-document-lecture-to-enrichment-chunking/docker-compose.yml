version: "3.8"

services:
  # Container A: Gotenberg (The Muscle) - Handles file conversion
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "3001:3000"
    environment:
      - GOTENBERG_API_TIMEOUT=300s
      - GOTENBERG_LIBREOFFICE_RESTART_AFTER=10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - worker-network

  # Container B: Python Worker (The Brain) - Handles business logic
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-enrichment-worker
    depends_on:
      gotenberg:
        condition: service_healthy
    environment:
      # AWS Configuration
      - AWS_REGION=ap-southeast-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

      # SQS Configuration
      - SQS_QUEUE_URL=https://sqs.ap-southeast-1.amazonaws.com/211125750777/lms-prod-document-lecture-to-enrichment-chunking-queue

      # Gotenberg Configuration (internal network)
      - GOTENBERG_URL=http://gotenberg:3000

      # Gemini API
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # Callback URL
      - CALLBACK_URL=${CALLBACK_URL:-https://dev.viettrandai.xyz/api/coaching-chatbot/v1/document-enrichment-callback}
    volumes:
      - ./src:/app/src:ro
    networks:
      - worker-network

networks:
  worker-network:
    driver: bridge
