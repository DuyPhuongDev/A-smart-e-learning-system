apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: lms
spec:
  selector:
    app: eureka-server
  ports:
    - name: http
      port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: lms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: asia-southeast1-docker.pkg.dev/capstone-project-495404/lms/eureka-server:v1
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: lms-config
