server:
  port: 8090

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lms_db}?currentSchema=notification
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:lms_user}
    password: ${DB_PASSWORD:lms_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: notification
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    default-schema: notification
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
    out-of-order: false
    validate-on-migrate: true
  jackson:
    time-zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

notification:
  scheduler:
    poll-interval-ms: 30000
    outbox-interval-ms: 5000
    retry-interval-ms: 60000
    digest-cron: "0 15 0 * * *"
    retention-cron: "0 30 1 * * *"
  retention-days: 180
  email:
    from: ${MAIL_FROM:no-reply@welearning.local}
    retry-delays-minutes: 1,5,15
  kafka:
    inbound-topic: ${KAFKA_NOTIFICATION_INBOUND_TOPIC:lms.events.notification}
    outbound-topic: lms.events.notification.created

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    com.hcmut.lms.notification: INFO
