server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        globalcors:
          cors-configurations:
            "[/**]":
              allowedOrigins: "*"
              allowedMethods:
                - GET
                - POST
                - OPTIONS
                - PUT
                - DELETE
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # Authentication Service - Public endpoints handled by RouteValidator
            # Internal endpoints are blocked by InternalEndpointBlockFilter
            - id: authentication-service
              uri: lb://authentication-service
              predicates:
                - Path=/api/auth/**

            # User Management Service
            - id: user-management-service
              uri: lb://user-management-service
              predicates:
                - Path=/api/users/**,/api/roles/**,/api/import-export/**

            # Course Management Service
            - id: course-management-service
              uri: lb://course-management-service
              predicates:
                - Path=/api/courses/**
            # Learning Service
            - id: learning-service
              uri: lb://learning-service
              predicates:
                - Path=/api/learning/**
            # Assessment Service
            - id: assessment-service
              uri: lb://assessment-service
              predicates:
                - Path=/api/assessment/**
            # Notification Service REST APIs
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
            # Coaching Chatbot Service (for Fargate worker callbacks)
            - id: coaching-chatbot-service
              uri: lb://coaching-chatbot-service
              predicates:
                - Path=/api/coaching-chatbot/**
            # Personalization Service
            - id: personalization-service
              uri: lb://personalization-service
              predicates:
                - Path=/api/personalization/**

  # Disable Redis auto-configuration (for development without Redis)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# JWT Configuration - MUST match authentication-service
jwt:
  secret: ${JWT_SECRET:uoc-gi-anh-bot-dang-cap-1-ty-de-hoa-dong-voi-moi-nguoi-hon}

# Rate Limiting Configuration
rate-limit:
  enabled: false # Disabled without Redis
  requests-per-second: 100

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# Logging
logging:
  level:
    "[com.hcmut.lms.gateway]": DEBUG
    "[org.springframework.cloud.gateway]": INFO

# Management endpoints
management:
  health:
    redis:
      enabled: false
