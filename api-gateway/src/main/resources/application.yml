server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Authentication Service - Public endpoints handled by RouteValidator
        # Internal endpoints are blocked by InternalEndpointBlockFilter
        - id: authentication-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/auth/**
                
        # User Management Service
        - id: user-management-service
          uri: lb://user-management-service
          predicates:
            - Path=/api/users/**
            
        # Course Management Service
        - id: course-management-service
          uri: lb://course-management-service
          predicates:
            - Path=/api/courses/**
            
        # Assessment Management Service
        - id: assessment-management-service
          uri: lb://assessment-management-service
          predicates:
            - Path=/api/assessments/**
            
        # Course Delivery Service
        - id: course-delivery-service
          uri: lb://course-delivery-service
          predicates:
            - Path=/api/delivery/**
            
        # Assessment Execution Service
        - id: assessment-execution-service
          uri: lb://assessment-execution-service
          predicates:
            - Path=/api/execution/**
            
        # Student Personalization Service
        - id: student-personalization-service
          uri: lb://student-personalization-service
          predicates:
            - Path=/api/personalization/**
            
        # Tracking Service
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/tracking/**
            
        # Enrollment Service
        - id: enrollment-service
          uri: lb://enrollment-service
          predicates:
            - Path=/api/enrollment/**
            
        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
            
        # Communication Service
        - id: communication-service
          uri: lb://communication-service
          predicates:
            - Path=/api/communication/**
            
        # Analytics & Reporting Service
        - id: analytics-reporting-service
          uri: lb://analytics-reporting-service
          predicates:
            - Path=/api/analytics/**

# JWT Configuration - MUST match authentication-service
jwt:
  secret: ${JWT_SECRET:uoc-gi-anh-bot-dang-cap-1-ty-de-hoa-dong-voi-moi-nguoi-hon}

# Rate Limiting Configuration
rate-limit:
  enabled: true
  requests-per-second: 100

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# Logging
logging:
  level:
    com.hcmut.lms.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

